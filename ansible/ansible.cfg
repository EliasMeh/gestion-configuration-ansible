[defaults]
inventory               = /vagrant/ansible/inventories/hosts.yml
roles_path              = /vagrant/ansible/roles
remote_user             = vagrant
private_key_file        = /home/vagrant/.ssh/id_ed25519
; laboratoire uniquement (en production : known_hosts géré)
host_key_checking       = False
retry_files_enabled     = False
interpreter_python      = auto_silent
; sorties lisibles
callback_result_format  = yaml
nocows                  = True
; Une identité Ansible Vault par environnement (activée au TP4)
; série avancée : copie hors du partage /vagrant (fmode=775 les rendrait exécutables)
vault_identity_list     = preprod@/home/vagrant/.nova-vault/preprod, prod@/home/vagrant/.nova-vault/prod

[ssh_connection]
; moins d'allers-retours SSH, exécution plus rapide
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
