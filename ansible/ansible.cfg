[defaults]
vars_plugins_enabled = host_group_vars,community.sops.sops
collections_path = /vagrant/ansible/collections:~/.ansible/collections
inventory              = /vagrant/ansible/inventories/nova_cmdb.py
roles_path              = /vagrant/ansible/roles
remote_user             = vagrant
private_key_file        = /home/vagrant/.ssh/id_ed25519
; laboratoire uniquement (en production : known_hosts géré)
host_key_checking       = False
retry_files_enabled     = False
interpreter_python      = auto_silent
; sorties lisibles
callback_result_format  = yaml
nocows                  = True
; TP A5 : Ansible Vault remplacé par SOPS + age (plugin community.sops, clés chargées par scripts/sops-env.sh)

[ssh_connection]
; moins d'allers-retours SSH, exécution plus rapide
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
