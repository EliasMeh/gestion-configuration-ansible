---
- name: Installer git (requis par 'helm plugin install')
  ansible.builtin.apt:
    lock_timeout: 120
    name: git
    state: present

- name: Installer les dépendances Python du module kubernetes.core.helm
  ansible.builtin.pip:
    name:
      - kubernetes
      - PyYAML
    state: present

- name: Installer le binaire Helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1", "--wildcards", "*/helm"]
    creates: /usr/local/bin/helm

- name: Lister les plugins Helm installés
  ansible.builtin.command: helm plugin list
  register: helm_plugins
  changed_when: false
  failed_when: false

- name: Supprimer le dossier d'un plugin helm-diff cassé
  ansible.builtin.file:
    path: /root/.local/share/helm/plugins/helm-diff
    state: absent
  when: helm_plugins.rc != 0 or 'diff' not in helm_plugins.stdout

- name: Installer le plugin helm-diff (utile pour --check --diff)
  kubernetes.core.helm_plugin:
    plugin_path: https://github.com/databus23/helm-diff
    plugin_version: "{{ helm_diff_version }}"
    state: present
