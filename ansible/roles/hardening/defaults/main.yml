---
# --- PSSI-01 : accès d'administration SSH ---
hardening_ssh_permit_root: "no"
hardening_ssh_password_auth: "no"
hardening_ssh_max_auth_tries: 4
hardening_ssh_allow_groups: []          # liste de groupes autorisés (vide = pas de restriction)

# --- PSSI-02 : paramètres noyau ---
# PSSI-07 (dérogation DER-01) : net.ipv4.ip_forward reste à 1, indispensable au réseau de pods k3s.
hardening_sysctl:
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.tcp_syncookies: 1
  kernel.randomize_va_space: 2
  kernel.dmesg_restrict: 1
  fs.suid_dumpable: 0

hardening_blacklisted_modules: [cramfs, freevxfs, hfs, hfsplus, usb-storage]
# apport remet fs.suid_dumpable à 2 à chaque démarrage (vu au TP13, scénario 4) : CIS demande de le retirer.
hardening_removed_packages: [telnet, rsh-client, nis, apport]

# --- PSSI-05 : filtrage réseau en liste blanche ---
hardening_firewall_enabled: true
hardening_firewall_rules:
  - { port: 22, src: 192.168.56.10, comment: "SSH depuis ctrl" }
  - { port: 22, src: 10.0.2.0/24, comment: "SSH Vagrant (interface NAT)" }
  - { port: 80, src: 192.168.56.10, comment: "HTTP depuis ctrl (smoke tests)" }
  - { port: 80, src: 192.168.56.1, comment: "HTTP depuis le poste hôte" }
  - { port: 443, src: 192.168.56.1, comment: "HTTPS depuis le poste hôte" }
  - { port: 6443, src: 192.168.56.10, comment: "API Kubernetes depuis ctrl uniquement" }
hardening_k3s_cidrs: ["10.42.0.0/16", "10.43.0.0/16"]   # pods et services k3s
# Sources autorisées sur l'Ingress (80/443) : celles des règles ci-dessus, le nœud lui-même
# (test Goss) et les pods. ServiceLB contourne ufw : voir templates/traefik-config.yaml.j2.
hardening_ingress_sources: >-
  {{ ((hardening_firewall_rules | selectattr('port', 'in', [80, 443]) | map(attribute='src')
       | map('regex_replace', '^([0-9.]+)$', '\1/32') | list)
      + [ansible_host ~ '/32'] + hardening_k3s_cidrs) | unique }}
