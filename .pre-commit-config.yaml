# Garde-fous exécutés AVANT chaque commit (installation : pre-commit install)
repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint (style YAML)
        entry: yamllint -c .yamllint
        language: system
        types: [yaml]
        exclude: ^(charts/|ansible/inventories/group_vars/.*/vault\.yml)
      - id: ansible-lint
        name: ansible-lint (bonnes pratiques)
        entry: bash -c 'cd ansible && ansible-lint -c ../.ansible-lint playbooks roles'
        language: system
        pass_filenames: false
        files: ^ansible/
      - id: forbid-plain-vault
        name: refuser un vault.yml non chiffré
        entry: >-
          bash -c 'for f in "$@"; do head -1 "$f" | grep -q "^[$]ANSIBLE_VAULT" || { echo "NON CHIFFRE - $f"; exit 1; }; done' --
        language: system
        files: vault\.yml$
      - id: forbid-plain-sops
        name: refuser un fichier *.sops.yaml non chiffré
        entry: >-
          bash -c 'for f in "$@"; do grep -q "^sops:" "$f" || { echo "NON CHIFFRE - $f"; exit 1; }; done' --
        language: system
        # tout fichier <nom>.sops.yaml (le support ne visait que secrets.sops.yaml), pas le .sops.yaml racine
        files: /[^/]+\.sops\.ya?ml$
  - repo: local
    hooks:
      - id: nova-policy
        name: politiques NOVA (conftest)
        entry: scripts/policy-check.sh
        language: system
        pass_filenames: false
        files: ^(charts/|policy/|ansible/inventories/)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Fichiers SOPS : valeurs chiffrées et clés publiques age (faux positifs) ; leur chiffrement
        # est contrôlé par le hook forbid-plain-sops (TP A5).
        args: ['--baseline', '.secrets.baseline', '--exclude-files', '(^|/)(\.sops\.yaml|.*\.sops\.ya?ml)$']
