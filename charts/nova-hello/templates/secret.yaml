{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nova-hello.secretName" . }}
  labels:
    {{- include "nova-hello.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_TOKEN: {{ .Values.secret.apiToken | quote }}
{{- end }}
