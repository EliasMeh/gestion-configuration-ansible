# Valeurs par défaut : sûres et minimales. Chaque environnement les surcharge.
replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"            # jamais "latest" : imposé par values.schema.json
  pullPolicy: IfNotPresent

app:
  environment: dev
  greeting: "Hello NOVA"
  version: "1.0.0"

service:
  port: 80

ingress:
  enabled: true
  className: traefik           # contrôleur Ingress fourni par k3s
  host: hello.nova.local

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 100m, memory: 64Mi }

secret:
  create: true
  existingSecret: ""
  apiToken: "change-me"

networkPolicy:
  enabled: false

podAnnotations: {}
